<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Onyx ESM</title>

<!-- enyo's own stylesheet, then onyx's generated one. -->
<link rel="stylesheet" href="/enyo/css/enyo.css">
<link rel="stylesheet" href="/onyx/css/onyx.css">
<style>
 body { font: 14px/1.5 system-ui, sans-serif; margin: 2rem; background: #fff; }
 h1, h2 { font-family: system-ui, sans-serif; }
 #app { margin: 1rem 0; }
 .row { margin-bottom: 1rem; }
 #log { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 13px; color: #444; }
 #log .f { color: #c5221f; font-weight: bold; }

 /*
  * This rule belongs to the application, not to onyx, and it is not new here.
  * Onyx positions popups with rules like `.onyx-menu { top: 100%; left: 0 }`
  * and enyo's Popup.js writes left/top/z-index inline, but neither
  * enyo/css/enyo.css nor any onyx .less ever declares `position: absolute`
  * for `.enyo-popup`. Without it a floating Menu or Picker lands wherever
  * normal flow puts it. That gap is in onyx 2.7 as published and has nothing
  * to do with the module conversion -- see MIGRATION.md. The page supplies it
  * so the demo is positioned the way an app would be.
  */
 .enyo-popup { position: absolute; }
</style>

<!--
	Onyx is a separate package from enyo, so every `enyo/src/...` specifier in
	src/ is a bare specifier. This map is what resolves them, and it is the
	only configuration a page needs. Serve the directory that holds both
	checkouts:

		python3 test-onyx/serve.py 8000 /path/containing/enyo/and/onyx

	Use serve.py rather than `python3 -m http.server`: the latter lets the
	browser cache ES modules, and a query string on this page's URL does not
	bust them, so a reload can re-run stale code and report a false pass.

	`onyx/` is mapped too, because that is the form the JSDoc examples use.
-->
<script type="importmap">
{
	"imports": {
		"enyo/": "/enyo/",
		"onyx/": "/onyx/",
		"layout/": "/layout/",
		"enyo-ilib": "/enyo-ilib/index.js",
		"enyo-ilib/": "/enyo-ilib/"
	}
}
</script>
</head>
<body>

<h1>Onyx widgets, loaded as ES modules</h1>
<p>No bundler, no build step: just <code>&lt;script type="module"&gt;</code> and the
import map above.</p>

<div id="app"></div>

<h2>Across two package boundaries</h2>
<p>onyx widgets that are built on the <code>layout</code> package.</p>
<div id="layoutApp"></div>

<h2>Locale-aware, through enyo-ilib</h2>
<div id="i18nApp"></div>

<h2>Checks</h2>
<div id="log">running…</div>

<!--
	A module that fails to LINK -- a missing export, an unresolvable specifier --
	never runs, so the module script below cannot report its own failure and the
	page would sit on "running…" with a green-looking title forever. This
	classic script is not a module, so it always runs, and it turns that silence
	into a visible failure.
-->
<script>
window.addEventListener('error', function (e) {
	document.title = 'FAIL (load)';
	document.getElementById('log').innerHTML =
		'<span class="f">FAIL  the page did not load: ' +
		String(e.message).replace(/</g, '&lt;') + '</span>';
});
setTimeout(function () {
	if (!window.onyxEsmTest) {
		document.title = 'FAIL (did not finish)';
		document.getElementById('log').insertAdjacentHTML('beforeend',
			'\n<span class="f">FAIL  checks did not finish — see the console</span>');
	}
}, 10000);
</script>

<script type="module">
// Imported exactly the way the JSDoc examples are now written.
import kind     from 'enyo/src/kind.js';
import Control  from 'enyo/src/Control/Control.js';
import ready    from 'enyo/src/ready.js';

// Deliberately NOT `import ... from 'onyx/index.js'`. The point of the body
// class check below is that a *widget* module pulled index.js in. If this page
// imported index.js itself, the class would appear either way and the check
// could never fail -- which is exactly the trap it exists to catch. index.js
// is imported dynamically at the end, after that check has been made.
import Button          from 'onyx/src/Button/Button.js';
import Checkbox        from 'onyx/src/Checkbox/Checkbox.js';
import ToggleButton    from 'onyx/src/ToggleButton/ToggleButton.js';
import Toolbar         from 'onyx/src/Toolbar/Toolbar.js';
import Grabber         from 'onyx/src/Grabber/Grabber.js';
import Icon            from 'onyx/src/Icon/Icon.js';
import InputDecorator  from 'onyx/src/InputDecorator.js';
import Input           from 'onyx/src/Input/Input.js';
import Picker          from 'onyx/src/Picker/Picker.js';
import PickerDecorator from 'onyx/src/PickerDecorator.js';
import Menu            from 'onyx/src/Menu/Menu.js';
import MenuDecorator   from 'onyx/src/MenuDecorator.js';
import MenuItem        from 'onyx/src/MenuItem.js';
import ProgressBar     from 'onyx/src/ProgressBar/ProgressBar.js';
import Spinner         from 'onyx/src/Spinner/Spinner.js';

// These four were unloadable until the layout package was converted: each
// reaches across two package boundaries, onyx -> layout -> enyo.
import TabBar          from 'onyx/src/TabBar/TabBar.js';
import TabPanels       from 'onyx/src/TabPanels.js';
import MoreToolbar     from 'onyx/src/MoreToolbar/MoreToolbar.js';
import DatePicker      from 'onyx/src/DatePicker/DatePicker.js';

// The last two: locale-aware pickers, blocked on enyo-ilib until it was
// converted. These reach onyx -> enyo-ilib -> its vendored iLib.
import I18nDatePicker  from 'onyx/src/i18n/DatePicker.js';
import I18nTimePicker  from 'onyx/src/i18n/TimePicker.js';
import DateFactory     from 'enyo-ilib/ilib/lib/DateFactory.js';
import DateFmt         from 'enyo-ilib/ilib/lib/DateFmt.js';

const results = [];
function check (name, pass, detail) {
	results.push((pass ? 'PASS  ' : 'FAIL  ') + name + (detail ? '  — ' + detail : ''));
	const el = document.getElementById('log');
	el.innerHTML = results.map(function (r) {
		return r.indexOf('FAIL') === 0 ? '<span class="f">' + r + '</span>' : r;
	}).join('\n');
	if (!pass) console.error('FAIL: ' + name + (detail ? '  — ' + detail : ''));
}

// ---------------------------------------------------------------- modules ---

// NOT `typeof k === 'function'`. That cannot fail: a module with no default
// export is a link-time SyntaxError, so this page would never run at all and
// no check would report. (Verified: removing Spinner's `export default` leaves
// the page stuck on "running…" with a console SyntaxError — which is what the
// watchdog below is for.) What can fail is the export carrying the wrong
// value, so each binding is checked to be the constructor it should be.
const expectedKinds = [
	[Button, 'onyx.Button'], [Checkbox, 'onyx.Checkbox'],
	[ToggleButton, 'onyx.ToggleButton'], [Toolbar, 'onyx.Toolbar'],
	[Grabber, 'onyx.Grabber'], [Icon, 'onyx.Icon'],
	[InputDecorator, 'onyx.InputDecorator'], [Input, 'onyx.Input'],
	[Picker, 'onyx.Picker'], [PickerDecorator, 'onyx.PickerDecorator'],
	[Menu, 'onyx.Menu'], [MenuDecorator, 'onyx.MenuDecorator'],
	[MenuItem, 'onyx.MenuItem'], [ProgressBar, 'onyx.ProgressBar'],
	[Spinner, 'onyx.Spinner'],
	// the layout-dependent four
	[TabBar, 'onyx.TabBar'], [TabPanels, 'onyx.TabPanels'],
	[MoreToolbar, 'onyx.MoreToolbar'], [DatePicker, 'onyx.DatePicker']
];
const wrongKinds = expectedKinds.filter(function (pair) {
	return typeof pair[0] !== 'function' ||
		!pair[0].prototype ||
		pair[0].prototype.kindName !== pair[1];
}).map(function (pair) { return pair[1]; });
check('each default export is its kind constructor', wrongKinds.length === 0,
	wrongKinds.length ? 'wrong: ' + wrongKinds.join(', ') : expectedKinds.length + ' kinds');

// index.js runs dom.addBodyClass('onyx') as a side effect. Every onyx
// stylesheet is written as `.onyx .onyx-button`-style descendant rules off
// this class, so if the 44 `require('onyx')` statements had been dropped the
// widgets would render unstyled with no error at all. enyo queues the class
// until the first root renders, so this is only true after renderInto below.
check('onyx body class still queued before any render',
	!document.body.classList.contains('onyx'));

// -------------------------------------------------------------- the widgets ---

let buttonTaps = 0, checkboxChanges = 0, toggleChanges = 0, menuSelections = 0;
let lastMenuSelection = null;

const Demo = kind({
	name: 'OnyxEsmDemo',
	kind: Control,
	components: [
		{kind: Toolbar, components: [
			{kind: Grabber},
			{content: 'Onyx toolbar'},
			{kind: InputDecorator, components: [
				{name: 'input', kind: Input, placeholder: 'type here'}
			]},
			{kind: MenuDecorator, onSelect: 'menuSelected', components: [
				{name: 'menuBtn', content: 'Menu'},
				{name: 'menu', kind: Menu, floating: true, components: [
					{name: 'mi1', content: 'First'},
					{classes: 'onyx-menu-divider'},
					{name: 'mi2', content: 'Second'}
				]}
			]}
		]},

		{classes: 'row', components: [
			{name: 'btn', kind: Button, content: 'Button', ontap: 'buttonTapped'},
			{kind: Button, content: 'Affirmative', classes: 'onyx-affirmative'},
			{kind: Button, content: 'Negative', classes: 'onyx-negative'},
			{kind: Icon, src: '/onyx/images/more.png'}
		]},

		{classes: 'row', components: [
			{name: 'cb', kind: Checkbox, onchange: 'checkboxChanged'},
			{name: 'tb', kind: ToggleButton, onChange: 'toggleChanged'}
		]},

		{classes: 'row', components: [
			{name: 'picker', kind: PickerDecorator, components: [
				{},   // PickerDecorator's defaultKind is PickerButton
				{name: 'pickerMenu', kind: Picker, components: [
					{name: 'p1', content: 'Gmail', active: true},
					{name: 'p2', content: 'Yahoo'},
					{name: 'p3', content: 'Outlook'}
				]}
			]}
		]},

		{classes: 'row', components: [
			{name: 'pb', kind: ProgressBar, progress: 40},
			{kind: Spinner}
		]}
	],

	buttonTapped:    function () { buttonTaps++; this.$.btn.set('content', 'Tapped ' + buttonTaps); },
	checkboxChanged: function () { checkboxChanges++; },
	toggleChanged:   function () { toggleChanges++; },
	menuSelected:    function (sender, event) {
		menuSelections++;
		lastMenuSelection = event.originator && event.originator.content;
	}
});

function styleOf (node, prop) {
	return getComputedStyle(node).getPropertyValue(prop);
}

ready(async function () {
	const d = new Demo();
	d.renderInto(document.getElementById('app'));
	check('demo rendered', !!d.hasNode());

	// The side effect of index.js, flushed by the first renderInto. This page
	// never imports index.js itself, so the class can only be here because a
	// widget module imported it. Strip the `import '../index.js'` statements
	// from src/ and this goes red.
	check('onyx body class applied by index.js side effect',
		document.body.classList.contains('onyx'));

	// --- styling actually applied, not merely present in the DOM ---
	const btnNode = d.$.btn.hasNode();
	check('button has onyx classes', btnNode.className.indexOf('onyx-button') !== -1,
		btnNode.className);
	check('css/onyx.css loaded and applied',
		styleOf(btnNode, 'font-size') === '16px',
		'font-size=' + styleOf(btnNode, 'font-size'));
	check('button background image from onyx.css',
		styleOf(btnNode, 'background-image').indexOf('gradient.png') !== -1,
		styleOf(btnNode, 'background-image'));
	check('body picked up .onyx font rules',
		styleOf(document.body, 'font-family').indexOf('Helvetica Neue') !== -1 ||
		styleOf(d.hasNode(), 'font-family').indexOf('Helvetica Neue') !== -1,
		styleOf(d.hasNode(), 'font-family'));

	// --- interaction: a real DOM click through enyo's dispatcher ---
	btnNode.click();
	check('Button ontap handler fired', buttonTaps === 1, 'taps=' + buttonTaps);
	check('set() re-rendered the button', btnNode.textContent === 'Tapped 1',
		btnNode.textContent);

	d.$.cb.hasNode().click();
	check('Checkbox toggled by a real click', d.$.cb.get('checked') === true,
		'checked=' + d.$.cb.get('checked'));
	check('Checkbox onchange fired', checkboxChanges === 1, 'changes=' + checkboxChanges);

	const toggleBefore = d.$.tb.get('value');
	d.$.tb.hasNode().click();
	check('ToggleButton flipped value', d.$.tb.get('value') !== toggleBefore,
		toggleBefore + ' -> ' + d.$.tb.get('value'));
	check('ToggleButton onChange fired', toggleChanges === 1, 'changes=' + toggleChanges);

	// --- layering: a floating Menu renders outside the control tree ---
	check('Menu starts hidden', d.$.menu.get('showing') === false);
	d.$.menuBtn.hasNode().click();
	check('Menu opened on activator click', d.$.menu.get('showing') === true);
	check('floating Menu left the control tree for the floating layer',
		d.$.menu.hasNode().parentNode !== d.$.menuBtn.hasNode().parentNode,
		'menu parent = ' + d.$.menu.hasNode().parentNode.className);
	check('floating Menu is positioned and stacked',
		styleOf(d.$.menu.hasNode(), 'position') === 'absolute' &&
		parseInt(styleOf(d.$.menu.hasNode(), 'z-index'), 10) > 0,
		'position=' + styleOf(d.$.menu.hasNode(), 'position') +
		' z-index=' + styleOf(d.$.menu.hasNode(), 'z-index'));
	check('Popup.js computed a position for the floating Menu',
		/\d/.test(d.$.menu.hasNode().style.top) && /\d/.test(d.$.menu.hasNode().style.left),
		'top=' + d.$.menu.hasNode().style.top + ' left=' + d.$.menu.hasNode().style.left);

	d.$.mi2.hasNode().click();
	check('MenuItem onSelect reached the decorator', menuSelections === 1,
		'selections=' + menuSelections);
	check('onSelect carried the item', lastMenuSelection === 'Second',
		'content=' + lastMenuSelection);

	// --- Picker: layering plus selection writing back to the button ---
	const pickerButton = d.$.picker.children[0];
	check('PickerButton took the decorator defaultKind',
		pickerButton.kindName === 'onyx.PickerButton', pickerButton.kindName);
	check('Picker initialised to the active item',
		pickerButton.get('content') === 'Gmail', pickerButton.get('content'));

	pickerButton.hasNode().click();
	check('Picker opened', d.$.pickerMenu.get('showing') === true);
	d.$.p3.hasNode().click();
	check('Picker closed on selection', d.$.pickerMenu.get('showing') === false);
	check('selection written back to the PickerButton',
		pickerButton.get('content') === 'Outlook', pickerButton.get('content'));

	// --- a published property drives the DOM ---
	d.$.pb.set('progress', 75);
	check('ProgressBar reflects progress',
		d.$.pb.$.bar.hasNode().style.width === '75%',
		'width=' + d.$.pb.$.bar.hasNode().style.width);

	// --- the layout-dependent widgets, rendered for real ---
	// These reach onyx -> layout -> enyo, so this is the only check here that
	// exercises two package boundaries at once. All four were unloadable
	// before the layout package was converted.
	const LayoutDemo = kind({
		name: 'OnyxLayoutDemo',
		kind: Control,
		components: [
			{name: 'tabs', kind: TabPanels, animate: false, style: 'height: 120px;', components: [
				{name: 'tp0', content: 'First panel'},
				{name: 'tp1', content: 'Second panel'},
				{name: 'tp2', content: 'Third panel'}
			]},
			{name: 'more', kind: MoreToolbar, components: [
				{content: 'More toolbar'}
			]},
			{name: 'date', kind: DatePicker}
		]
	});
	let layoutDemoError = null, ld = null;
	try {
		ld = new LayoutDemo();
		ld.renderInto(document.getElementById('layoutApp'));
	} catch (e) { layoutDemoError = String(e); }

	check('layout-dependent widgets render', layoutDemoError === null && !!(ld && ld.hasNode()),
		layoutDemoError || 'ok');
	check('TabPanels built its TabBar from layout/Panels',
		!!ld.$.tabs.$.bar && ld.$.tabs.$.bar.kindName === 'onyx.TabBar',
		ld.$.tabs.$.bar && ld.$.tabs.$.bar.kindName);
	// Not "starts on panel 0": each tab activates as it is added, so the last
	// one wins and TabPanels opens on it. That is enyo Group behaviour and
	// predates this conversion. The invariant worth asserting is that the
	// panel index and the TabBar selection agree.
	check('TabPanels index agrees with its TabBar selection',
		ld.$.tabs.get('index') === ld.$.tabs.$.bar.selectedId,
		'index=' + ld.$.tabs.get('index') + ' selectedId=' + ld.$.tabs.$.bar.selectedId);

	ld.$.tabs.setIndex(0);
	check('TabPanels switched panel through layout/Panels',
		ld.$.tabs.get('index') === 0, 'index=' + ld.$.tabs.get('index'));
	check('the layout arranger hid the inactive panel',
		styleOf(ld.$.tp0.hasNode(), 'display') !== 'none' &&
		styleOf(ld.$.tp2.hasNode(), 'display') === 'none',
		'tp0=' + styleOf(ld.$.tp0.hasNode(), 'display') +
		' tp2=' + styleOf(ld.$.tp2.hasNode(), 'display'));

	check('MoreToolbar got its layout/FittableLayout columns layout',
		ld.$.more.layout && /Fittable/.test(ld.$.more.layout.kindName),
		ld.$.more.layout && ld.$.more.layout.kindName);
	check('DatePicker rendered its pickers through layout/FlyweightRepeater',
		ld.$.date.hasNode().textContent.length > 0,
		JSON.stringify(ld.$.date.hasNode().textContent.slice(0, 30)));

	// --- the locale-aware pickers, onyx -> enyo-ilib ---
	// `import 'enyo-ilib';` is a side-effect import: it registers the calendar
	// and date classes into the synchronous registry DateFactory reads. So the
	// check is the effect, not that the import resolved -- a non-Gregorian
	// construction only works if registration actually ran.
	check('i18n pickers are their kinds',
		I18nDatePicker.prototype.kindName === 'onyx.DatePicker' &&
		I18nTimePicker.prototype.kindName === 'onyx.TimePicker',
		I18nDatePicker.prototype.kindName + ' / ' + I18nTimePicker.prototype.kindName);

	const calendars = ['gregorian', 'julian', 'islamic', 'hebrew', 'persian', 'thaisolar'];
	const unregistered = calendars.filter(function (type) {
		try {
			const dt = DateFactory({type: type, year: 1440, month: 1, day: 1});
			return !dt || dt.getCalendar() !== type;
		} catch (e) { return true; }
	});
	check('enyo-ilib side-effect import registered the calendars',
		unregistered.length === 0,
		unregistered.length ? 'unregistered: ' + unregistered.join(', ')
			: calendars.length + ' calendars');

	// Formatting, not merely constructing: locale data is fetched at runtime,
	// so a DateFmt that constructs proves nothing about the loader.
	let formatted = null, fmtError = null;
	try {
		const fmt = new DateFmt({locale: 'en-US', type: 'date', length: 'short'});
		formatted = fmt.format(DateFactory({type: 'gregorian', year: 2026, month: 11, day: 16}));
	} catch (e) { fmtError = String(e.message || e); }
	check('DateFmt formatted a real date from fetched locale data',
		formatted === '11/16/26', fmtError || 'formatted=' + JSON.stringify(formatted));

	// Wrapped: without locale data this throws during render, which would
	// abort the run and leave only the watchdog to report it. A named failure
	// is more use than "did not finish".
	let i18nRendered = false, i18nText = '', i18nError = null;
	try {
		const i18nDemo = new I18nDatePicker();
		i18nDemo.renderInto(document.getElementById('i18nApp'));
		i18nRendered = !!i18nDemo.hasNode();
		i18nText = i18nDemo.hasNode().textContent;
	} catch (e) { i18nError = String(e.message || e); }
	check('locale-aware DatePicker rendered',
		i18nRendered && i18nText.length > 0,
		i18nError || JSON.stringify(i18nText.slice(0, 30)));

	// `this.inherited(arguments)` subclassing an onyx widget. This is not a
	// duplicate of enyo's own coverage: onyx's TabBar JSDoc tells app authors
	// to write exactly this, so it is onyx's documented advice that is on the
	// line, across a package boundary. It threw under ESM until enyo c0a23de7.
	const inheritedTrace = [];
	const MyButton = kind({
		name: 'test.MyButton',
		kind: Button,
		create: function () { this.inherited(arguments); inheritedTrace.push('mine'); }
	});
	const Deeper = kind({
		name: 'test.Deeper',
		kind: MyButton,
		create: function () { this.inherited(arguments); inheritedTrace.push('deeper'); }
	});
	let inheritedError = null;
	try { new Deeper({content: 'x'}); } catch (e) { inheritedError = String(e); }
	check('this.inherited(arguments) works subclassing an onyx widget',
		inheritedError === null && inheritedTrace.join(',') === 'mine,deeper',
		inheritedError || 'trace=' + inheritedTrace.join(','));

	// Only now, with the body class already asserted, is it safe for this page
	// to touch index.js itself.
	const onyxPackage = await import('onyx/index.js');
	check('version named export from index.js', onyxPackage.version === '2.7.0',
		'version=' + onyxPackage.version);

	const failed = results.filter(function (r) { return r.indexOf('FAIL') === 0; });
	document.title = failed.length ? 'FAIL (' + failed.length + ')' : 'ALL PASS';
	window.onyxEsmTest = {results: results, failed: failed.length, total: results.length};
	console.log(failed.length
		? 'ONYX TESTS FAILED: ' + failed.join(' | ')
		: 'ALL ' + results.length + ' ONYX TESTS PASSED');
});
</script>
</body>
</html>
